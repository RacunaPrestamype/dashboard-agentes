# Tablero de uso de los agentes. Un solo servicio: lee las bases de los otros
# dos repos, no levanta ninguna.
#
# Las dos bases llegan distinto, porque son distintas:
#   LeIA  archivo SQLite, se monta desde el disco del host (o desde el volumen
#         de LeIA si el tablero corre en la misma máquina que el agente).
#   GDP   Postgres, se llega por red con el rol `tablero` (solo SELECT). Si su
#         base corre en Docker, hay que compartir su red: ver `redes` abajo.

services:
  dashboard:
    build: .
    container_name: agentes-dashboard
    environment:
      LEIA_DB_PATH: /datos/leia/gestora.db
      # Rol de SOLO LECTURA del agente GDP (db/04_rol_tablero.sh en ese repo).
      # Nunca el rol `agente`: ese escribe, y un proceso de reporting no tiene
      # por qué poder.
      GDP_BD_URL: ${GDP_BD_URL:-}
      # Cuentas que no son uso real (internas, QA, la batería de evaluación).
      LEIA_EXCLUIR_USUARIOS: ${LEIA_EXCLUIR_USUARIOS:-dacuna,admin,cpardave,dbaldeon}
      GDP_EXCLUIR_EMAILS: ${GDP_EXCLUIR_EMAILS:-evaluacion@prestamype.com,qa@prestamype.com}
      HOST: 0.0.0.0
      PORT: 8080
    volumes:
      # Montaje rw a propósito, aunque el tablero no escriba: la base de LeIA
      # está en WAL y SQLite necesita tocar el -shm para leer lo que todavía
      # vive en el -wal. Con :ro fallaría al abrir, o mostraría datos viejos
      # hasta el próximo checkpoint. La conexión sí es read-only (mode=ro).
      - ${LEIA_DB_DIR:-../LeIA/db}:/datos/leia
    ports:
      - "${PUERTO_TABLERO:-8095}:8080"
    restart: unless-stopped

# Para llegar al Postgres del agente GDP corriendo en Docker: descomentar, y
# poner GDP_BD_URL=postgresql://tablero:CLAVE@db:5432/agente
#
#    networks: [ gdp ]
#
# networks:
#   gdp:
#     external: true
#     name: agente_indicadores_gdp_interna
