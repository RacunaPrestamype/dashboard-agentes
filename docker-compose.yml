# Tablero de uso de los agentes. Un solo servicio: lee las bases de los otros
# dos repos, no levanta ninguna.
#
# Las dos bases llegan distinto, porque son distintas:
#   LeIA  archivo SQLite -> se monta el volumen del stack de LeIA.
#   GDP   Postgres       -> se entra a su red interna y se le habla a `db`.
# Por eso el volumen y la red son `external`: son de otros compose, este no los
# crea ni los borra. Si alguno no existe, `up` falla diciendo cuál falta.
#
# En una máquina donde los agentes NO corren en Docker, el volumen se reemplaza
# por un bind mount a la carpeta que tiene gestora.db, y GDP_BD_URL apunta al
# host en vez de a `db`.

services:
  dashboard:
    build: .
    container_name: agentes-dashboard
    environment:
      LEIA_DB_PATH: /datos/leia/gestora.db
      # Rol de SOLO LECTURA del agente GDP (db/04_rol_tablero.sh en ese repo).
      # Nunca el rol `agente`: ese escribe, y un proceso de reporting no tiene
      # por qué poder. El default con la clave de dev es el mismo que usa el
      # compose de GDP; en un despliegue real se pasa GDP_BD_URL.
      GDP_BD_URL: ${GDP_BD_URL:-postgresql://tablero:dev-solo-local@db:5432/agente}
      # Cuentas que no son uso real (internas, QA, la batería de evaluación).
      LEIA_EXCLUIR_USUARIOS: ${LEIA_EXCLUIR_USUARIOS:-dacuna,admin,cpardave,dbaldeon}
      GDP_EXCLUIR_EMAILS: ${GDP_EXCLUIR_EMAILS:-evaluacion@prestamype.com,qa@prestamype.com}
      HOST: 0.0.0.0
      PORT: 8080
    volumes:
      # Montaje rw a propósito, aunque el tablero no escriba: la base de LeIA
      # está en WAL y SQLite necesita el -shm para leer lo que todavía vive en
      # el -wal. La conexión sí es read-only (mode=ro), y el contenedor corre
      # con un usuario que no es dueño de esos archivos: no puede escribirlos
      # ni queriendo.
      - leia-db:/datos/leia
    networks: [ gdp ]
    ports:
      - "${PUERTO_TABLERO:-8095}:8080"
    restart: unless-stopped

volumes:
  leia-db:
    external: true
    name: ${LEIA_VOLUMEN:-leia-db-data}

networks:
  gdp:
    external: true
    name: ${RED_GDP:-agente_indicadores_gdp_interna}
